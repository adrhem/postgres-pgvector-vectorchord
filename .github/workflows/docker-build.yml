name: Build, Test and Push Docker Image

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Release tags are v<PostgreSQL major>-<image version>, e.g. v18-1.0.0.
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pg_major=$(sed -n 's/^FROM postgres:\([0-9]*\)$/\1/p' Dockerfile)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v${pg_major}-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v${pg_major}-X.Y.Z for PostgreSQL ${pg_major}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.dev.yml config --quiet

      - name: Test both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" --tag postgres-test:local .
            bash scripts/smoke-test.sh postgres-test:local --platform "$platform"
            SMOKE_POSTGRES_PASSWORD='' bash scripts/smoke-test.sh postgres-test:local --platform "$platform"
          done

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/postgres-pgvector-vectorchord
          flavor: latest=false
          tags: |
            type=match,pattern=^v(\d+-\d+\.\d+\.\d+)$,group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^v(\d+-\d+\.\d+)\.\d+$,group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^v(\d+)-,group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=sha

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
